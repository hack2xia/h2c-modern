<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>h2c - headers to curl</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <span class="mark">h2c</span>
      <span class="title">headers to curl</span>
      <span class="sub">HTTP request → curl command, converted locally</span>
    </header>

    <main>
      <div class="panels">
        <div class="panel req">
          <label for="input"><span class="dot"></span>HTTP request</label>
          <textarea
            id="input"
            spellcheck="false"
            placeholder="GET / HTTP/1.1
Host: example.com
"
          ></textarea>
        </div>
        <div class="panel res">
          <label><span class="dot"></span>curl command</label>
          <pre id="output" aria-live="polite"></pre>
          <div id="warnings" hidden aria-live="polite"></div>
        </div>
      </div>

      <div class="controls">
        <label class="chip">
          <input type="checkbox" id="opt-short" />
          <span class="tick"></span>Short options
        </label>
        <label class="chip">
          <input type="checkbox" id="opt-verbose" />
          <span class="tick"></span>verbose
        </label>
        <label class="chip">
          <input type="checkbox" id="opt-default" />
          <span class="tick"></span>Default headers
        </label>
        <label class="chip">
          <input type="checkbox" id="opt-version" />
          <span class="tick"></span>HTTP version
        </label>
        <label class="chip">
          <input type="checkbox" id="opt-http" />
          <span class="tick"></span>http://
        </label>
        <label class="chip">
          <input type="radio" name="opt-shell" value="sh" checked />
          <span class="tick"></span>sh
        </label>
        <label class="chip">
          <input type="radio" name="opt-shell" value="powershell" />
          <span class="tick"></span>PowerShell
        </label>
        <button id="copy" type="button" disabled>Copy</button>
      </div>
    </main>

    <footer>
      Conversion runs locally in your browser — nothing is uploaded · <a
        href="https://github.com/curl/h2c"
        target="_blank"
        rel="noopener"
      >Original project</a>
    </footer>

    <script type="module">
    import { convert, ConvertWarning } from './_build/convert.mjs';

    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const warnings = document.getElementById('warnings');
    const copy = document.getElementById('copy');

    const readOpts = () => ({
      shortOpt: document.getElementById('opt-short').checked,
      verbose: document.getElementById('opt-verbose').checked,
      allowDefaultHeaders: document.getElementById('opt-default').checked,
      sameHttpVersion: document.getElementById('opt-version').checked,
      useHttp: document.getElementById('opt-http').checked,
      shell: document.querySelector('input[name="opt-shell"]:checked').value,
    });

    function update() {
      output.classList.remove('error', 'warning');
      warnings.hidden = true;
      warnings.textContent = '';
      let ok = true;
      try {
        const result = convert(input.value, readOpts());
        output.textContent = result.command;
        if (result.warnings.length > 0) {
          warnings.textContent = result.warnings.map((w) => '⚠ ' + w).join('\n');
          warnings.hidden = false;
        }
      } catch (e) {
        ok = false;
        if (e instanceof ConvertWarning) {
          output.textContent = '⚠ ' + e.message;
          output.classList.add('warning');
        } else {
          output.textContent = e.message;
          output.classList.add('error');
        }
      }
      // 错误/拒绝态下输出区是提示文案而非命令，禁用复制避免把提示当命令复制走
      copy.disabled = !ok;
    }

    input.addEventListener('input', update);
    document
      .querySelectorAll('.controls input')
      .forEach((el) => el.addEventListener('change', update));

    copy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(output.textContent);
        copy.textContent = 'Copied';
        setTimeout(() => (copy.textContent = 'Copy'), 1500);
      } catch {
        // 剪贴板不可用（如非安全上下文/权限拒绝）：给用户可见反馈而不是静默
        copy.textContent = 'Copy failed';
        setTimeout(() => (copy.textContent = 'Copy'), 1500);
      }
    });

    input.value = 'GET / HTTP/1.1\nHost: example.com\n';
    update();
    </script>
  </body>
</html>
